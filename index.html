<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flip the coin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Flip the coin</h1>
    <div class="coin-container" id="coin-container">
        <div id="coin" class="coin">
            <div class="coin-face heads">$</div>
            <div class="coin-face tails">I</div>
            <div class="coin-edge"></div>
        </div>
    </div>
    <button id="flip-button">Random</button>
    <div id="result" class="result"></div>
</div>
<script src="script.js"></script>
</body>
</html>
